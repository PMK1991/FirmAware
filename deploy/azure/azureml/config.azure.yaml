# Pipeline training config. Identical to the repository-root config.yaml except
# for the two settings that only make sense inside the workspace:
#
#   mlflow.tracking_uri   -- overridden at runtime by MLFLOW_TRACKING_URI, which
#                            the pipeline sets to the workspace store. The value
#                            here is only a local fallback so the file stays
#                            runnable outside Azure.
#   mlflow.register_model -- FALSE, and that is the whole point. Locally the
#                            train step registers directly. In the pipeline the
#                            evaluate gate stands between training and the
#                            registry, so a model that fails the gate leaves no
#                            version behind. Registration is the register
#                            component's job and nothing else's.
#
# Every modelling number below is byte-identical to config.yaml: the pipeline
# must not quietly train a different model than the one the tests cover.
seed: 42
cutoff_quantile: 0.8
cutoff_date: null
cost_ratio_fn_fp: 5
calibrate: false
models:
  logistic: {C: 1.0, max_iter: 1000}
  xgboost: {n_estimators: 200, max_depth: 5, learning_rate: 0.1}
tuning:
  enabled: true
  strategy: randomized
  champion_selection: holdout_expected_cost
  cv_folds: 4
  initial_train_quantile: 0.4
  max_candidates:
    logistic: 12
    xgboost: 30
  search_spaces:
    logistic:
      C: [0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0]
      max_iter: [2000]
      class_weight: [null, balanced]
    xgboost:
      n_estimators: [100, 200, 300, 400, 600]
      max_depth: [2, 3, 4, 5, 6, 8]
      learning_rate: [0.01, 0.03, 0.05, 0.1, 0.2]
      min_child_weight: [1, 3, 5, 8]
      subsample: [0.65, 0.8, 1.0]
      colsample_bytree: [0.65, 0.8, 1.0]
      reg_alpha: [0.0, 0.01, 0.1, 1.0]
      reg_lambda: [0.1, 1.0, 5.0, 10.0]
      gamma: [0.0, 0.1, 0.5, 1.0]
mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_root: mlruns
  experiment_name: firmaware
  run_name: null
  register_model: false
  registered_model_name: FirmAwareRiskModel
  artifact_path: model
  log_row_level_artifacts: false
