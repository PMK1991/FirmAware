[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmaware"
version = "1.1.0"
description = "A portable MLflow firmware deployment risk pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  # A range, where every other pin here is exact. Community Cloud picks the
  # interpreter, 1.26 publishes no wheels past 3.12, and the hosted deploy has
  # no toolchain to build one, so an exact pin here cost the page two
  # interpreter versions. Training narrows it back to exact below.
  "numpy>=1.26,<3",
  "PyYAML==6.0.2",
  "google-cloud-storage==3.13.0",
]

[project.optional-dependencies]
# The schema, feature and IO modules need nothing beyond the base: only the
# modelling path pulls this in. Keeping it optional halves the read-only
# deployment, 402 MB over 55 packages against 855 MB over 114, because
# scikit-learn and xgboost drag in scipy and mlflow drags in a web stack.
train = [
  # The exact numpy pin lives here rather than in the base because MLflow is
  # what constrains it: numpy 2 tightened can_cast, so MLflow rejects int64
  # input against a double signature. Nothing can train without this extra, so
  # the constraint still holds everywhere it applies.
  "numpy==1.26.4",
  "scikit-learn==1.6.1",
  "xgboost==3.0.5",
  # MLflow 2, not 3, and this is a hard Azure constraint rather than caution.
  # Azure ML's hosted tracking server implements the MLflow 2 REST surface: it
  # has no /api/2.0/mlflow/logged-models. MLflow 3's Model.log() calls
  # _create_logged_model unconditionally -- there is no flag, env var or
  # fallback -- so every log_model against an AML workspace dies on a 404 after
  # training has already finished. azureml-mlflow only caps (mlflow-skinny
  # <=3.13.0) and sets no floor, so 2.x satisfies it.
  #
  # Still one version in every environment, which is the point: local, GCP and
  # AML must agree, and AML is the one that cannot move. The code already uses
  # the log_model(artifact_path=...) idiom that MLflow 3 deprecates, so nothing
  # here depends on a 3.x API.
  "mlflow==2.22.5",
]
app = [
  "streamlit==1.51.0",
  "plotly==6.4.0",
]
# Azure's storage SDK is optional for the same reason google-cloud-storage is
# not: io.py imports it lazily, so only a deployment that actually reads
# abfss:// pays for it. The Azure ML image installs this extra; the Streamlit
# page and the GCP jobs never do.
#
# azureml-mlflow and azureml-inference-server-http are here rather than in an
# AML conda_file because the runtime image is python:3.11-slim, which has no
# conda: a conda_file layered onto it cannot build. Putting them in the image
# also keeps the deployed artefact the thing that was tested, instead of
# something AML assembles at deploy time.
azure = [
  "azure-identity>=1.17,<2",
  "azure-storage-file-datalake>=12.16,<13",
  # Redirects the application's existing MLflow calls at the workspace tracking
  # store without any application code change. Pinned exactly: an open range
  # lets the resolver backtrack to a 1.5x release that also caps
  # azure-storage-blob below what the datalake client needs, producing an
  # unsolvable set rather than an older install.
  "azureml-mlflow==1.62.0.post5",
  # Managed online endpoints run the scoring script under this server. Without
  # it in the image, a custom-image deployment with a scoring_script fails to
  # start.
  "azureml-inference-server-http>=1.0,<2",
  # A transitive floor, not a direct import. Nothing in this project calls
  # msgpack; it arrives under the Azure SDKs, whose own range was open enough
  # that the resolver settled on a version carrying a fixed HIGH. Trivy blocks
  # the build on that, so this floor is what keeps the image shippable. Raise
  # it when trivy next says to.
  #
  # cryptography deliberately has no floor here, though trivy flags it too:
  # azureml-mlflow declares cryptography<49.0.0 and both fix versions are 49
  # and 50, so a floor makes the set unsolvable rather than secure. It is
  # recorded in .trivyignore with the rest of the pin's consequences.
  "msgpack>=1.2.1",
]
dev = [
  "pytest>=8.0,<9",
  # Pinned exactly: ruff has no config here, so its default rule set decides what
  # CI enforces. A range let CI resolve a newer ruff than local and fail on rules
  # local never ran. Bump deliberately, with the resulting fixes in the same change.
  "ruff==0.16.1",
]
notebooks = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
