[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmaware"
version = "1.1.0"
description = "A portable MLflow firmware deployment risk pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "PyYAML>=6.0",
  "mlflow>=2.16,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
