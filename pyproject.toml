[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmaware"
version = "1.1.0"
description = "A portable MLflow firmware deployment risk pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  # Deliberately a range where every other pin is exact. The page resolves this
  # on whatever interpreter Community Cloud offers, and 1.26 publishes no wheels
  # for 3.13+, so pinning it here made the hosted deploy try to compile numpy
  # from source and fail. Training narrows it back to an exact version below.
  "numpy>=1.26,<3",
  "PyYAML==6.0.2",
  "google-cloud-storage==3.13.0",
]

[project.optional-dependencies]
# The schema, feature and IO modules need nothing beyond the base: only the
# modelling path pulls this in. Keeping it optional halves the read-only
# deployment, 402 MB over 55 packages against 855 MB over 114, because
# scikit-learn and xgboost drag in scipy and mlflow drags in a web stack.
train = [
  # Pinned with the rest of the numerical stack, and pinned here rather than in
  # the base because MLflow is what constrains it: numpy 2 tightened can_cast,
  # so MLflow rejects int64 input against a double signature. Nothing can train
  # without this extra, so the constraint still holds wherever it matters.
  "numpy==1.26.4",
  "scikit-learn==1.6.1",
  "xgboost==3.0.5",
  "mlflow==3.14.0",
]
app = [
  "streamlit==1.51.0",
  "plotly==6.4.0",
]
dev = [
  "pytest>=8.0,<9",
  # Pinned exactly: ruff has no config here, so its default rule set decides what
  # CI enforces. A range let CI resolve a newer ruff than local and fail on rules
  # local never ran. Bump deliberately, with the resulting fixes in the same change.
  "ruff==0.16.1",
]
notebooks = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
