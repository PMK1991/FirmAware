name: Deploy dev (Azure)

# Runs on merge to main. The order below is the deployment contract, and every
# step is a gate for the one after it:
#
#   build (digest) -> terraform apply -> deploy green at 0% -> smoke -> promote
#   10/50/100 with a health check between each -> security_check
#
# The new deployment holds zero traffic until it has proved it can score the
# fixture correctly, and any failure during promotion rolls the endpoint back to
# the previously live slot. There is no path through this file that leaves
# production serving something that was never smoke tested.

on:
  push:
    branches: [main]
    paths:
      - "infra/azure/**"
      - "deploy/azure/**"
      - "src/**"
      - "app.py"
      - "demo/**"
      - ".streamlit/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/azure-deploy-dev.yaml"
  workflow_dispatch:
    inputs:
      run_training:
        description: "Submit the training pipeline before deploying"
        type: boolean
        default: false

# id-token to federate with Azure, contents to check out the code. Nothing else:
# this workflow has no reason to write to the repository or to packages.
permissions:
  id-token: write
  contents: read

# One deploy at a time. Two concurrent applies against one Terraform state is a
# corrupted state file, and two concurrent traffic shifts is an endpoint in an
# unknown split.
concurrency:
  group: azure-deploy-dev
  cancel-in-progress: false

# AZURE_RESOURCE_GROUP is deliberately absent: it is read from the tfvars by the
# "Resolve resource group" step below, because Terraform is the only thing
# entitled to decide it. A literal here drifted once already.
env:
  AZURE_ML_WORKSPACE: mlw-firmaware-dev
  TF_VAR_FILE: envs/dev.tfvars

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    # The ARM_* variables are what make Terraform federate. Azure/login
    # authenticates the az CLI, but the azurerm provider refuses to reuse a CLI
    # session belonging to a service principal -- it fails with "Authenticating
    # using the Azure CLI is only supported as a User (not a Service Principal)"
    # -- so it has to obtain its own token. With ARM_USE_OIDC set it requests one
    # from the Actions token endpoint using the id-token permission this workflow
    # already holds, which covers both the provider and the azurerm state backend
    # (use_azuread_auth = true).
    #
    # Declared on the job, not the workflow: these read environment-scoped
    # variables, and those only resolve once a job has named its `environment`.
    # At job scope every step gets them, so init, plan, apply and each
    # `terraform output` all authenticate the same way -- a step that missed them
    # would fail on state access rather than on anything in the plan.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    outputs:
      image_digest: ${{ steps.build.outputs.image_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Before anything that talks to Azure, so no step can run against a group
      # that does not exist.
      - name: Resolve resource group
        run: |
          rg="$(bash deploy/azure/resource_group.sh dev)"
          echo "AZURE_RESOURCE_GROUP=${rg}" >> "$GITHUB_ENV"
          echo "resource group: ${rg}"

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      # Federated: the workflow presents a short-lived OIDC token and receives an
      # Azure token scoped to one managed identity. There is no secret in this
      # repository to rotate, expire, or leak.
      - name: Azure login (OIDC)
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install az ml extension
        run: az extension add --name ml --yes --allow-preview false

      # The page lives on Container Apps, which is a separate CLI extension from
      # `ml`. Installed here rather than lazily on first use, because the lazy
      # install prompts, and a prompt in CI is a hang rather than an error.
      # There is no stable containerapp extension -- every published version is
      # flagged preview -- so `--allow-preview false` cannot install one. Pinned
      # to an exact version rather than floating, because an unpinned preview
      # extension is a moving dependency sitting in the release path, and this
      # repository pins image digests for the same reason.
      - name: Install az containerapp extension
        run: az extension add --name containerapp --version 0.3.55 --allow-preview true --yes

      - name: Resolve registry name
        id: registry
        run: |
          acr="$(az acr list -g "${AZURE_RESOURCE_GROUP}" --query "[0].name" -o tsv)"
          echo "name=${acr}" >> "$GITHUB_OUTPUT"

      # Built in ACR, so the runner never needs a Docker daemon or registry
      # credentials. Emits the digest that every later step refers to.
      - name: Build and push image
        id: build
        env:
          AZURE_ACR_NAME: ${{ steps.registry.outputs.name }}
        run: bash deploy/azure/build.sh dev

      # The page, from the same Dockerfile and the same build script, into its
      # own repository so the two digests can never be confused for one another.
      #
      # Before Terraform, not after, and that ordering is load-bearing: the
      # container app is digest-pinned, so `terraform plan` cannot describe it
      # without knowing which digest. TF_VAR_app_image is how that reaches the
      # plan and the apply alike.
      - name: Build and push the page image
        id: build_app
        env:
          AZURE_ACR_NAME: ${{ steps.registry.outputs.name }}
          FIRMAWARE_IMAGE_REPOSITORY: firmaware-app
          FIRMAWARE_IMAGE_TARGET: app
          PIP_EXTRAS: app,azure
        run: |
          digest="$(bash deploy/azure/build.sh dev | sed -n 's/^image_digest=//p' | tail -1)"
          [[ -n "${digest}" ]] || { echo "::error::the page build emitted no digest" >&2; exit 1; }
          echo "TF_VAR_app_image=${digest}" >> "$GITHUB_ENV"
          echo "page image: ${digest}"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"

      - name: Terraform init
        working-directory: infra/azure
        run: terraform init -backend-config=envs/dev.backend.hcl

      # The plan is written to the step summary so a reviewer can read what
      # changed without opening the run log, and applied from the saved plan file
      # so what is applied is exactly what was shown.
      - name: Terraform plan
        working-directory: infra/azure
        run: |
          terraform plan -var-file="${TF_VAR_FILE}" -out=tfplan -no-color | tee plan.txt
          {
            echo "### Terraform plan (dev)"
            echo '```'
            tail -n 100 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        working-directory: infra/azure
        run: terraform apply -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf
        working-directory: infra/azure
        run: |
          {
            echo "storage_account=$(terraform output -raw storage_account_name)"
            echo "key_vault=$(terraform output -raw key_vault_name)"
            echo "workspace=$(terraform output -raw machine_learning_workspace_name)"
            echo "instance_type=$(terraform output -raw online_instance_type)"
            echo "endpoint_enabled=$(terraform output -raw online_endpoint_enabled)"
            echo "cicd_principal=$(terraform output -raw cicd_identity_principal_id)"
            echo "app_url=$(terraform output -raw app_url)"
            echo "app_client_id=$(terraform output -raw app_identity_client_id)"
            echo "app_principal=$(terraform output -raw app_identity_principal_id)"
            echo "scores_uri=$(terraform output -raw scores_uri)"
            echo "scores_container_id=$(terraform output -raw scores_container_id)"
          } >> "$GITHUB_OUTPUT"

      # --- the page -------------------------------------------------------------
      # Independent of the model: it reads whatever the batch pipeline last
      # published, so it neither waits for training nor blocks it. Placed here,
      # before the long-running ML steps, so a page regression is reported in
      # three minutes rather than twenty.

      - name: Deploy the page into a new revision at 0% traffic
        id: deploy_app
        run: bash deploy/azure/deploy_app.sh dev "${{ env.TF_VAR_app_image }}"

      # On the revision's own hostname, while the live one keeps serving. This is
      # also where the public-access decision is actively checked rather than
      # assumed -- see section [2] of the script.
      - name: Smoke test the new revision
        env:
          FIRMAWARE_IMAGE_DIGEST: ${{ env.TF_VAR_app_image }}
          FIRMAWARE_SCORES_URI: ${{ steps.tf.outputs.scores_uri }}
          FIRMAWARE_APP_CLIENT_ID: ${{ steps.tf.outputs.app_client_id }}
          FIRMAWARE_APP_PRINCIPAL_ID: ${{ steps.tf.outputs.app_principal }}
          FIRMAWARE_SCORES_CONTAINER_ID: ${{ steps.tf.outputs.scores_container_id }}
        run: bash deploy/azure/smoke_test_app.sh dev "${{ steps.deploy_app.outputs.revision }}"

      - name: Promote the page
        run: |
          bash deploy/azure/promote_app.sh dev \
            "${{ steps.deploy_app.outputs.revision }}" \
            "${{ steps.deploy_app.outputs.previous_revision }}"

      # The previous revision is still provisioned at 0%, so this is a traffic
      # flip and not a redeploy. Guarded on the promotion having happened: before
      # that point the new revision holds no traffic and there is nothing to undo.
      - name: Roll the page back on failure
        if: failure() && steps.deploy_app.outcome == 'success'
        run: |
          bash deploy/azure/rollback_app.sh dev \
            "${{ steps.deploy_app.outputs.previous_revision }}"

      # After Terraform (the workspace must exist) and after the build (the
      # environment pins the image digest). Everything downstream refers to
      # `azureml:firmaware-env@latest` and the two data assets, so nothing can
      # run until these are registered.
      - name: Register AML environment and data assets
        id: assets
        env:
          AZURE_ACR_NAME: ${{ steps.registry.outputs.name }}
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
          AZURE_STORAGE_ACCOUNT: ${{ steps.tf.outputs.storage_account }}
          FIRMAWARE_IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: bash deploy/azure/register_assets.sh dev

      # Training is not wired to merge. It runs only when explicitly requested,
      # because a model change deserves its own decision even when the code that
      # produced it did not change.
      - name: Train
        id: train
        if: inputs.run_training
        env:
          FIRMAWARE_IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
        run: bash deploy/azure/run_training.sh dev

      # Deliberately not gated on endpoint_enabled: the batch endpoint needs a
      # model version too, and dev leaves the online endpoint off to save cost.
      - name: Resolve model version
        id: model
        env:
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
        run: |
          version="${{ steps.train.outputs.model_version }}"
          if [[ -z "${version}" ]]; then
            version="$(az ml model list --name FirmAwareRiskModel \
              --workspace-name "${AZURE_ML_WORKSPACE}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query "[].version" -o tsv | sort -n | tail -1)"
          fi
          # Missing is only fatal where something must be deployed to. The online
          # path cannot proceed without one; batch simply does not run, which is
          # the correct outcome for an environment that has never trained.
          if [[ -z "${version}" && "${{ steps.tf.outputs.endpoint_enabled }}" == "true" ]]; then
            echo "no registered model to deploy" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Deploy into the idle slot at 0% traffic
        id: deploy
        if: steps.tf.outputs.endpoint_enabled == 'true'
        env:
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
          FIRMAWARE_INSTANCE_TYPE: ${{ steps.tf.outputs.instance_type }}
          FIRMAWARE_MIN_INSTANCES: "0"
        run: |
          bash deploy/azure/deploy_endpoint.sh dev \
            "${{ steps.model.outputs.version }}" \
            "${{ steps.build.outputs.image_digest }}"

      # Deployment-specific route: this proves the new slot works while the old
      # one is still serving every real request.
      - name: Smoke test the new slot
        if: steps.tf.outputs.endpoint_enabled == 'true'
        env:
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
          FIRMAWARE_MODEL_VERSION: ${{ steps.model.outputs.version }}
          FIRMAWARE_IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: bash deploy/azure/smoke_test.sh dev "${{ steps.deploy.outputs.deployment }}"

      - name: Promote traffic 10 -> 50 -> 100
        if: steps.tf.outputs.endpoint_enabled == 'true'
        env:
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
          FIRMAWARE_MODEL_VERSION: ${{ steps.model.outputs.version }}
        run: |
          bash deploy/azure/promote_traffic.sh dev \
            "${{ steps.deploy.outputs.deployment }}" \
            "${{ steps.deploy.outputs.live_deployment }}"

      # Batch has no traffic map and no warm slot, so there is nothing to
      # promote: the deployment is created and becomes the endpoint's default in
      # one step. Runs whenever a model version was resolved, independently of
      # `endpoint_enabled` -- dev leaves the online endpoint off to save cost,
      # and bulk scoring should still work there. Without this step the only
      # thing that ever created a batch deployment was rollback_model.sh.
      - name: Point the batch endpoint at the model
        if: steps.model.outputs.version != ''
        env:
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
          FIRMAWARE_IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: bash deploy/azure/deploy_batch.sh dev "${{ steps.model.outputs.version }}"

      # Same five-minute assertion problem as the security gate below, reached a
      # different way. The token minted at login covers ARM, so every step above
      # keeps working from cache; this is the first step that asks for a storage
      # audience, and acquiring one needs the assertion rather than the cache.
      # The page steps at the top of this job added roughly ten minutes ahead of
      # it, which is what pushed that request past the window and turned a
      # working batch check into AADSTS700024.
      - name: Refresh Azure login before the batch smoke test
        if: steps.model.outputs.version != ''
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The online smoke test cannot stand in for this. Batch runs a different
      # entry script on a different runtime, under a different identity, and
      # writes through a different storage path -- every batch defect this
      # project hit was invisible to the online path and to every unit test.
      # It also proves the publish step, without which scoring succeeds and
      # silently leaves the scores container empty.
      - name: Batch smoke test
        if: steps.model.outputs.version != ''
        env:
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
          AZURE_STORAGE_ACCOUNT: ${{ steps.tf.outputs.storage_account }}
          FIRMAWARE_MODEL_VERSION: ${{ steps.model.outputs.version }}
        run: bash deploy/azure/batch_smoke_test.sh dev

      # The client assertion Azure/login exchanges is valid for five minutes.
      # Batch scoring takes closer to ten, because the cluster scales from zero,
      # so by the time the checks below run the CLI is holding a stale assertion
      # and every token it has not already cached fails AADSTS700024. Logging in
      # again mints a fresh one. Cheap, and it keeps the security gate reporting
      # on the deployment rather than on the age of a credential.
      - name: Refresh Azure login before the security gate
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Runs last and still fails the job: a deploy that succeeded but left a
      # control broken is a failed deploy.
      - name: Security check
        env:
          AZURE_STORAGE_ACCOUNT: ${{ steps.tf.outputs.storage_account }}
          AZURE_KEY_VAULT: ${{ steps.tf.outputs.key_vault }}
          AZURE_ACR_NAME: ${{ steps.registry.outputs.name }}
          AZURE_ML_WORKSPACE: ${{ steps.tf.outputs.workspace }}
          FIRMAWARE_CICD_PRINCIPAL_ID: ${{ steps.tf.outputs.cicd_principal }}
          FIRMAWARE_NETWORK_ISOLATION: "false"
        run: bash deploy/azure/security_check.sh dev

      - name: Record what is live
        if: always()
        run: |
          {
            echo "### Dev deployment"
            echo "- image digest: \`${{ steps.build.outputs.image_digest }}\`"
            echo "- model version: \`${{ steps.model.outputs.version || 'n/a' }}\`"
            echo "- deployment slot: \`${{ steps.deploy.outputs.deployment || 'n/a' }}\`"
            echo "- page image: \`${{ env.TF_VAR_app_image || 'n/a' }}\`"
            echo "- page revision: \`${{ steps.deploy_app.outputs.revision || 'n/a' }}\`"
            echo "- page url: ${{ steps.tf.outputs.app_url || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
