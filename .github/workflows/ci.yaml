name: CI (shared application)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,app,train]"
      - run: ruff check src tests
      - run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Explicit, and it must stay explicit. `docker build` with no target
          # builds the LAST stage in the Dockerfile, so appending the `azureml`
          # serving stage silently retargeted this job: it started building an
          # image whose entrypoint is the AML inference server, failed the
          # stage's `import azureml_inference_server_http` guard under the
          # default PIP_EXTRAS, and would have failed the `--help` run below even
          # if it had built.
          target: runtime
          push: false
          load: true
          tags: firmaware:ci
      # Building only proves the install resolved. Cloud Run runs this image,
      # so also prove the entrypoint imports the training stack it was built for.
      - run: docker run --rm firmaware:ci --help
