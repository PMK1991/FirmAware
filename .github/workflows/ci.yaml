name: CI (shared application)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,app,train]"
      - run: ruff check src tests
      - run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: firmaware:ci
      # Building only proves the install resolved. Cloud Run runs this image,
      # so also prove the entrypoint imports the training stack it was built for.
      - run: docker run --rm firmaware:ci --help
